    <script>

    <style>

<body>

<div class="window">
    <div class="title-bar">康鷹空間資訊 RTK 控制面板 (工程版)</div>
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px; display: flex; align-items: center; white-space: nowrap;">
        <div style="flex: 1; text-align: left;">

    <div class="group">
      
      <div class="field" style="margin-bottom: 5px;">
          <label>設備 ID :</label>

    <div class="group">

            <label style="margin-bottom: 0;">定位狀態:</label>

        </div>
        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">

        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">

            <span id="rtk_lon" class="val" style="width: auto; text-align: right;">--</span>
        </div>
        <!-- 新增：點擊開啟 Google 地圖按鈕/連結 -->
        <div class="field" style="flex-direction: row; justify-content: flex-end; margin-bottom: 5px;">
            <a id="rtk_map_link" href="javascript:void(0);" target="_blank" style="font-size: 13px; color: blue; text-decoration: underline; pointer-events: none; opacity: 0.5;">
                在 Google 地圖中開啟位置
            </a>
        </div>
        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label style="margin-bottom: 0;">橢球高 (Ellipsoid):</label>
            <span id="rtk_ell" class="val" style="width: auto; text-align: right;"></span>
        </div>     
        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label style="margin-bottom: 0;">海拔高 (Altitude):</label>
            <span id="rtk_alt" class="val" style="width: auto; text-align: right;"></span>
        </div>
        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label style="margin-bottom: 0;">地面高 (Geoid):</label>
            <span id="rtk_geo" class="val" style="width: auto; text-align: right;"></span>
        </div>      
        <div class="field" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <label style="margin-bottom: 0;">時間 (UTC+8):</label>
            <span id="rtk_time" class="val" style="width: auto; text-align: right;"></span>
        </div>
      
    </div>

    <div class="group">
        <div class="group-title">系統訊息(Log)</div>
        <div class="field" style="margin-bottom: 5px;">   
            <span id="rtk_log" class="val" style="width: 100%; font-size: 13px; text-align: left;
                word-break: break-all; overflow-wrap: break-word; white-space: pre-wrap; line-height: 1.3;"></span>
        </div>
    </div>

  
  
    <div class="group">
     <div class="group-title">連線模式</div>
        <table width="100%" border="0">
            <tr>
                <td width="30%" align="center"><button id="btn_idle" onclick="send_idle()">離線</button></td>
                <td width="30%" align="center"><button id="btn_rover" onclick="send_rover()">移動站</button></td>
                <td width="30%" align="center"><button id="btn_base" onclick="send_base()">基站</button></td>                 
            </tr>
        </table>
    </div>  
  
  
    <div class="group">
      <div class="group-title">基站座標</div>
      <div class="field">
        <label>緯度 (Latitude):</label>
        <input type="text" id="base_lat" value="">
      </div>
      
      <div class="field">
        <label>經度 (Longitude):</label>
        <input type="text" id="base_lon" value="">
      </div>
      
      <div class="field">
        <label>高度 (Height):</label>
        <input type="text" id="base_ell" value="">
      </div>
     
      <table width="100%" border="0">
        <tr>
          <td width="30%" align="center"><button onclick="loadBase()">讀取座標</button></td>
          <td width="30%" align="center"><button onclick="sendBase()">設為基站</button></td>
        </tr>
      </table> 
    </div>
  
    <div class="group">
        <div class="group-title"></div>
     
      <button onclick="sendRover()">設為移動站</button>
      
     </div>
  
    <div class="group">
        <div class="group-title">NTRIP 伺服器設定</div>
        <div class="field">
            <label>IP / 網址:</label>
            <input type="text" id="ntrip_ip" value="">
        </div>
        <div class="field">
            <label>連接埠 (Port):</label>
            <input type="text" id="ntrip_port" value="">
        </div>
        <div class="field">
            <label>掛載點 (Mount):</label>
            <input type="text" id="ntrip_mount" value="">
        </div>
        <div class="field">
            <label>基站名稱:</label>
            <input type="text" id="base_mount" value="">
        </div> 
      
        <div class="field">
            <label>User:</label>
            <input type="text" id="ntrip_user" value="">
        </div>
        <div class="field">
            <label>Password:</label>
            <input type="text" id="ntrip_pass" value="">
        </div>       
    <table width="100%" border="0">
        <tr>
            <td width="50%" align="center"><button onclick="loadConfig()">讀取設定</button></td>
            <td width="50%" align="center"><button onclick="sendConfig()">修改送出</button></td>
        </tr>
    </table>
      
    </div>
      <div class="group">
        <div class="group-title">自訂內容發送</div>
        <div class="field">
            <input type="text" id="Text1" value="saveconfig">
        </div>     
      <button onclick="sendButton1()">送出</button>
     </div>    
  </div>
<script>
    var workmode = "idle";
    var latDD = 0.0;
    var latDMS ="";
    var lonDD = 0.0;
    var lonDMS = "";
    var ellipsoid = 0.0;
    var geoid = 0.0;
    // ═══════════════ 動態 Topic 與 MQTTGO 設定 ═══════════════
    const host = 'wss://mqttgo.vip:8084/mqtt'; 
    
    // 改為動態變數 /user/rock859985/RTK/KY001/cmd
    let currentDeviceId = localStorage.getItem("rtk_device_id");
    let myTopic = `/user/rock859985/RTK/${currentDeviceId}/cmd`;
    let reportTopic1 = `/user/rock859985/RTK/${currentDeviceId}/nmea`; 
    let reportTopic2 = `/user/rock859985/RTK/${currentDeviceId}/log`;

    // 頁面載入時填入已儲存的 ID
    document.addEventListener("DOMContentLoaded", () => {
        const devInput = document.getElementById('device_id');
        if (devInput) devInput.value = currentDeviceId;
    });

    const options = {
        connectTimeout: 4000,
        clientId: 'WebKY' + Math.random().toString(16).substr(2, 8),
        username: 'rock859985', 
        password: 'Kb9waBiV9ZV3', 
    };

    console.log('正在連線至 MQTTGO...');
    const client = mqtt.connect(host, options);

    client.on('connect', () => {
        document.getElementById('status').innerText = '連線成功';
        document.getElementById('status').style.color = 'green';
        
        // 訂閱當前裝置主題
        subscribeTopics(currentDeviceId);
    });

    client.on('error', (err) => {
        document.getElementById('status').innerText = '連線失敗';
        document.getElementById('status').style.color = 'red';
    });

    // 訂閱函式
    function subscribeTopics(devId) {
        myTopic = `/user/rock859985/RTK/${devId}/cmd`;
        reportTopic1 = `/user/rock859985/RTK/${devId}/nmea`;
        reportTopic2 = `/user/rock859985/RTK/${devId}/log`;

        client.subscribe(reportTopic1);
        client.subscribe(reportTopic2);
        console.log(`已訂閱裝置 [${devId}] 主題`);
    }

    // 動態切換裝置函式
    function switchDevice() {
        const inputVal = document.getElementById('device_id').value.trim();
        if (!inputVal) {
            alert("請輸入裝置名稱！");
            return;
        }

        if (client.connected) {
            // 先退訂舊主題，避免多個裝置資料混雜
            client.unsubscribe(reportTopic1);
            client.unsubscribe(reportTopic2);

            // 清空當前畫面的舊數據
            clearDisplayValues();

            // 更新裝置 ID 並訂閱新主題
            currentDeviceId = inputVal;
            localStorage.setItem("rtk_device_id", currentDeviceId);
            subscribeTopics(currentDeviceId);
            //alert(`已切換至裝置：${currentDeviceId}`);
        } else {
            alert("MQTT 尚未連線，無法登入！");
        }
    }

    // 清空介面舊數據輔助函式
    function clearDisplayValues() {
        document.getElementById('rtk_sol').textContent = "--";
        document.getElementById('rtk_lat').textContent = "--";
        document.getElementById('rtk_lon').textContent = "--";
        document.getElementById('rtk_ell').textContent = "--";
        document.getElementById('rtk_alt').textContent = "--";
        document.getElementById('rtk_geo').textContent = "--";
        document.getElementById('rtk_time').textContent = "--";
        document.getElementById('rtk_uptime').textContent = "--";
        document.getElementById('rtk_tempC').textContent = "--";
        document.getElementById('rtk_log').textContent = "";
        const mapLinkElem = document.getElementById('rtk_map_link');
        if (mapLinkElem) {
            mapLinkElem.removeAttribute('href');
            mapLinkElem.style.pointerEvents = "none";
            mapLinkElem.style.opacity = "0.5";
        }        
    }

    
    client.on('message', (topic, message) => {
        const msgString = message.toString();
if (topic === reportTopic1) {
        try {
            let data = {};
            let latDD = 0;
            let lonDD = 0;
            let latDMS = "";

            // ═══════════════ 資料來源解析與統一適配 ═══════════════
            if (msgString.startsWith("{")) {
                // 1. 舊版相容：直接解析 JSON
                data = JSON.parse(msgString);
            } else {
                // 2. 新版相容：解析 NMEA 串流並映射為相同鍵名
                const lines = msgString.split(/\r?\n/);
                for (const line of lines) {
                    // ★ 修正此處的 || 邏輯運算子
                    if (line.startsWith("$GNGGA") \vert{}\vert{} line.startsWith("$GPGGA")) {
                        const parts = line.split(',');
                        
                        // NMEA GGA 欄位映射對齊
                        if (parts[1]) data.UTC = parts[1].substring(0, 6);
                        if (parts[2]) data.RawLat = parts[2];
                        if (parts[4]) data.RawLon = parts[4];
                        if (parts[6]) data.FixType = parts[6];
                        if (parts[7]) data.Sats = parts[7];
                        if (parts[9] && parts[9] !== "") data.Alt = parts[9];
                        if (parts[11] && parts[11] !== "") data.Geo = parts[11];

                        // 自動推算橢球高 (Alt + Geo)
                        if (data.Alt !== undefined && data.Geo !== undefined) {
                            data.Ellipsoid = (parseFloat(data.Alt) + parseFloat(data.Geo)).toFixed(3);
                        }
                        break; // 找到當秒 GGA 即可跳出
                    }
                }
            }

            // 1. 工作模式切換（若 reportTopic1 有帶 Status 才更新）
            if (data.Status) {
                workmode = data.Status;
                btn_idle.classList.remove("selected");
                btn_rover.classList.remove("selected");
                btn_base.classList.remove("selected");
                if (workmode === "idle") btn_idle.classList.add("selected");
                else if (workmode === "rover") btn_rover.classList.add("selected");
                else if (workmode === "base") btn_base.classList.add("selected");
            }

            // 2. 解算狀態判定
            const solElement = document.getElementById('rtk_sol');
            if (data.FixType && data.FixType !== "") {
                const fixStr = String(data.FixType).toUpperCase();
                
                let displayText = data.FixType;
                if (fixStr === "4") displayText = "RTK FIX";
                else if (fixStr === "5") displayText = "RTK FLOAT";
                else if (fixStr === "1") displayText = "SINGLE";
                else if (fixStr === "2") displayText = "DGPS";
                else if (fixStr === "0") displayText = "INVALID";

                solElement.textContent = displayText;

                if (fixStr.includes("FIX") || fixStr === "4") {
                    solElement.style.color = "green";
                } else if (fixStr.includes("FLOAT") || fixStr === "5" || fixStr === "2") {
                    solElement.style.color = "blue";
                } else {
                    solElement.style.color = "red";
                }
            } else {
                solElement.textContent = "--";
                solElement.style.color = "red";
            }

            // 3. 經緯度換算與填入
            if (data.RawLat) {
                latDD = parseFloat(nmeaToDD(data.RawLat).toFixed(8)); 
                latDMS = nmeaToDMS(data.RawLat);
                document.getElementById('rtk_lat').textContent = latDD + " / " + latDMS;               
            } else {
                document.getElementById('rtk_lat').textContent = "--";
            }
            
            if (data.RawLon) {
                lonDD = parseFloat(nmeaToDD(data.RawLon).toFixed(8)); 
                lonDMS = nmeaToDMS(data.RawLon);
                document.getElementById('rtk_lon').textContent = lonDD + " / " + lonDMS;               
            } else {
                document.getElementById('rtk_lon').textContent = "--";
            }

            // ═══════════════ 更新 Google Maps 連結 ═══════════════
            const mapLinkElem = document.getElementById('rtk_map_link');
            if (mapLinkElem) {
                if (data.RawLat && data.RawLon && latDD > 0 && lonDD > 0) {
                    mapLinkElem.href = `https://www.google.com/maps/search/?api=1&query=${latDD},${lonDD}`;
                    mapLinkElem.style.pointerEvents = "auto";
                    mapLinkElem.style.opacity = "1";
                } else {
                    mapLinkElem.removeAttribute('href');
                    mapLinkElem.style.pointerEvents = "none";
                    mapLinkElem.style.opacity = "0.5";
                }
            }          
                                      
            // 4. 高度資訊處理
            if (data.Ellipsoid !== undefined && data.Ellipsoid !== null) {
                document.getElementById('rtk_ell').textContent = data.Ellipsoid + " m";
                ellipsoid = data.Ellipsoid;
            } else {
                document.getElementById('rtk_ell').textContent = "--";
            } 

            if (data.Alt && data.Alt !== "") {
                document.getElementById('rtk_alt').textContent = data.Alt + " m";
            } else {
                document.getElementById('rtk_alt').textContent = "--";
            } 

            if (data.Geo && data.Geo !== "") {
                document.getElementById('rtk_geo').textContent = data.Geo + " m";
                geoid = data.Geo;
            } else {
                document.getElementById('rtk_geo').textContent = "--";
            } 
            
            // 5. 填入 UTC 時間並轉台灣時間 (UTC+8)
            if (data.UTC) {
                const utcStr = String(data.UTC).trim();
                
                if (utcStr.length === 6) {
                    let hh = parseInt(utcStr.substring(0, 2), 10);
                    const mm = utcStr.substring(2, 4);
                    const ss = utcStr.substring(4, 6);
                    
                    hh = (hh + 8) % 24;
                    const twHH = String(hh).padStart(2, '0');
                    document.getElementById('rtk_time').textContent = `${twHH}:${mm}:${ss}`;
                } else {
                    document.getElementById('rtk_time').textContent = utcStr;
                }
            }

        } catch (e) {
            console.error("reportTopic1 解析異常:", e, msgString);
        }
    }        
else if (topic === reportTopic2) {
            try {
                // 將收到的純文字嘗試解析為 JSON 物件
                const data = JSON.parse(msgString); 

                // ---------- 1. 保留原本的 NTRIP 參數設定 ----------
                if (data.host)       document.getElementById('ntrip_ip').value = data.host;
                if (data.port)       document.getElementById('ntrip_port').value = data.port;
                if (data.mount)      document.getElementById('ntrip_mount').value = data.mount;
                if (data.user)       document.getElementById('ntrip_user').value = data.user;
                if (data.pw)         document.getElementById('ntrip_pass').value = data.pw;
                if (data.base_mount) document.getElementById('base_mount').value = data.base_mount;                

                // ---------- 2. 設備工作模式 (Status) ----------
                if (data.Status) {
                    workmode = data.Status;
                    // 直接用 id 移除選中樣式
                    btn_idle.classList.remove("selected");
                    btn_rover.classList.remove("selected");
                    btn_base.classList.remove("selected");
                    if (workmode === "idle") btn_idle.classList.add("selected");
                    else if (workmode === "rover") btn_rover.classList.add("selected");
                    else if (workmode === "base") btn_base.classList.add("selected");
                }           

                // ---------- 4. ESP 運行時間 (Uptime) ----------
                if (data.Uptime !== undefined && data.Uptime !== null) {
                    const totalSeconds = Math.floor(data.Uptime);
                    
                    // 拆出天、時、分、秒
                    const days = Math.floor(totalSeconds / 86400); // 1天 = 86400秒
                    const hours = Math.floor((totalSeconds % 86400) / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60);
                    const seconds = totalSeconds % 60;
                
                    const h = String(hours).padStart(2, '0');
                    const m = String(minutes).padStart(2, '0');
                    const s = String(seconds).padStart(2, '0');
                
                    // 滿 1 天以上顯示天數，否則只顯示時:分:秒
                    if (days > 0) {
                        document.getElementById('rtk_uptime').textContent = `${days}d ${h}:${m}:${s}`;
                    } else {
                        document.getElementById('rtk_uptime').textContent = `${h}:${m}:${s}`;
                    }
                }

                // ---------- 5. LM35D 溫度 (TempC) ----------
                if (data.TempC !== undefined && data.TempC !== null) {
                    document.getElementById('rtk_tempC').textContent = Number(data.TempC).toFixed(0);
                }

            } catch (e) {

    // 1. 將 NMEA 原始座標轉成十進位度數 (DD.DDDDDD)
    function nmeaToDD(rawValue) {
        if (!rawValue) return 0;
        
        const str = rawValue.toString().trim();
        const dotIndex = str.indexOf('.');
        
        // NMEA 小數點前固定保留 2 位給「分」(MM)
        // 緯度是 DDMM.mmmm (小數點前 4 碼)
        // 經度是 DDDMM.mmmm (小數點前 5 碼)
        const splitIndex = (dotIndex !== -1 ? dotIndex : str.length) - 2;
        
        const degrees = parseFloat(str.slice(0, splitIndex));
        const minutes = parseFloat(str.slice(splitIndex));
        
        const dd = degrees + (minutes / 60);
        return Number(dd.toFixed(8)); // 轉回數字並保留 8 位
    }

    
    // 2. 將 NMEA 原始座標轉成度分秒字串 (D°M'S")
    function nmeaToDMS(rawValue) {
        if (!rawValue) return "";
    
        const str = rawValue.toString().trim();
        const dotIndex = str.indexOf('.');
        if (dotIndex === -1 && isNaN(str)) return "";
    
        // 小數點前倒數 2 位為「分」的分界點
        const splitIndex = (dotIndex !== -1 ? dotIndex : str.length) - 2;
        if (splitIndex <= 0) return "";
    
        let d = parseInt(str.slice(0, splitIndex), 10);
        const rawMinutes = parseFloat(str.slice(splitIndex));
        
        let m = Math.floor(rawMinutes);
        let sNum = (rawMinutes - m) * 60;
    
        // 四捨五入到小數點後 4 位
        let s = Number(sNum.toFixed(4));
    
        // 處理 60 秒進位保護
        if (s >= 60) {
            s = 0;
            m += 1;
            if (m >= 60) {
                m = 0;
                d += 1;
            }
        }
    
        const mStr = String(m).padStart(2, '0');
        const sStr = s.toFixed(4).padStart(7, '0'); // 秒數補前導零，如 05.1234
    
        return `${d}°${mStr}'${sStr}"`;
    }
